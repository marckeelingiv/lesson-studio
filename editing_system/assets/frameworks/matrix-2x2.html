<!DOCTYPE html>
<html
  lang="en"
  data-theme="dark"
  data-composition-variables='[
    {"id":"theme","type":"enum","label":"Theme","default":"dark","options":[{"value":"dark","label":"Dark"},{"value":"light","label":"Light"}]},
    {"id":"kicker","type":"string","label":"Kicker","default":"2x2 TRADEOFF MATRIX"},
    {"id":"title","type":"string","label":"Title","default":"Where Effort Compounds in Lesson Editing"},
    {"id":"yAxis","type":"string","label":"Y Axis","default":"Viewer Clarity"},
    {"id":"xAxis","type":"string","label":"X Axis","default":"Engineering Reuse"},
    {"id":"items","type":"string","label":"Quadrants","default":"One-Off Polish:Custom slides with low reuse|Signature Asset Moat:Hero decks & framework templates|Raw Capture:Hard cuts only for quick notes|Slop Trap:Neon blobs & hyperactive motion"},
    {"id":"highlightIndex","type":"number","label":"Highlight Quadrant","default":1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
    <title>Framework — Matrix 2x2</title>
    <link rel="stylesheet" href="../tokens/engineering-editorial/tokens.css" />
    <link rel="stylesheet" href="../motion/transitions.css" />
    <link rel="stylesheet" href="./frameworks.css" />
    <script src="../../../video_pipeline/hyperframes/node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../motion/mechanics.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="framework-matrix-2x2" data-width="1920" data-height="1080" data-duration="5">
      <div class="hf-stage">
        <div class="hf-safe-frame">
          <div class="hf-fw-shell">
            <div class="hf-fw-header">
              <div class="hf-kicker">
                <span class="hf-kicker-rule" data-layout-ignore></span>
                <span id="fw-matrix-kicker">2x2 TRADEOFF MATRIX</span>
              </div>
              <h1 id="fw-matrix-title" class="hf-title">Where Effort Compounds in Lesson Editing</h1>
            </div>
            <div class="hf-fw-stage">
              <div class="hf-fw-matrix-wrap">
                <div id="fw-matrix-yaxis" class="hf-fw-matrix-yaxis">Viewer Clarity</div>
                <div id="fw-matrix-grid" class="hf-fw-matrix-grid"></div>
                <div id="fw-matrix-xaxis" class="hf-fw-matrix-xaxis">Engineering Reuse</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var vars = window.LessonMotion.getVariables();
        window.LessonMotion.applyTheme(vars.theme);
        document.getElementById("fw-matrix-kicker").textContent = vars.kicker || "";
        document.getElementById("fw-matrix-title").textContent = vars.title || "";
        document.getElementById("fw-matrix-yaxis").textContent = vars.yAxis || "Y Axis";
        document.getElementById("fw-matrix-xaxis").textContent = vars.xAxis || "X Axis";

        var pairs = window.LessonMotion.parsePairs(vars.items, []).slice(0, 4);
        var highlightIdx = typeof vars.highlightIndex === "number" ? vars.highlightIndex : Number(vars.highlightIndex);
        var grid = document.getElementById("fw-matrix-grid");
        grid.innerHTML = "";
        pairs.forEach(function (pair, idx) {
          var cell = document.createElement("div");
          cell.className = "hf-fw-matrix-cell" + (idx === highlightIdx ? " is-highlighted" : "");
          var num = document.createElement("div");
          num.className = "hf-fw-step-num";
          num.textContent = "Q" + (idx + 1);
          var title = document.createElement("div");
          title.className = "hf-fw-step-title";
          title.textContent = pair.label;
          cell.appendChild(num);
          cell.appendChild(title);
          if (pair.detail) {
            var detail = document.createElement("div");
            detail.className = "hf-fw-step-detail";
            detail.textContent = pair.detail;
            cell.appendChild(detail);
          }
          grid.appendChild(cell);
        });

        var tl = window.LessonMotion.createTimeline("framework-matrix-2x2");
        window.LessonMotion.textEntrances(tl, "#fw-matrix-title", { at: 0, keepFrameZeroVisible: true });
        window.LessonMotion.cards(tl, "#fw-matrix-grid .hf-fw-matrix-cell", { at: 0.08, stagger: 0.08 });
        window.__timelines = window.__timelines || {};
        window.__timelines["framework-matrix-2x2"] = tl;
      })();
    </script>
  </body>
</html>
